# Telno on 192.168.1.53 — cutover file, built from branch
# `archive/local-main-2026-10-29` (pinned at 368a013), not `main`.
#
#   docker compose -f docker-compose.53.yml build     # 30-60 min: builds Asterisk
#   docker compose -f docker-compose.53.yml up -d
#
# Host networking is deliberate: the web port, SIP, RTP and AMI land on the
# host's own stack, so the reverse proxy reaches the app over a plain socket and
# no SDP address has to be rewritten through Docker's NAT. The carrier's NAT
# forwards for 5060/udp and 10000-10100/udp then keep pointing at .53 unchanged.
#
# The cost is that the ports below are the process's own listeners — they cannot
# be published, remapped or overlapped. In particular the switch's SIP transport
# is generated as `bind=0.0.0.0:5060` and its RTP range as 10000-10100 in
# src/telephony/provision.js; there is no environment variable that moves either.
# So this file runs only when Telno is the single switch on the host: stop the old
# telno-terminals container first. For a side-by-side dry run use
# docker-compose.53-preview.yml, which publishes 8081 only and keeps the switch
# inside its own network namespace.

name: telno

services:
  telno:
    build:
      context: ${TELNO_SRC:-/opt/telno}
      dockerfile: Dockerfile
      args:
        # Point these at a mirror when Docker Hub is rate-limited or blocked.
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        SWITCH_IMAGE: ${SWITCH_IMAGE:-debian:bookworm}
        # The branch defaults to 22-current; pin a release for a reproducible build.
        ASTERISK_VERSION: ${ASTERISK_VERSION:-22-current}

    # Built by .github/workflows/image.yml in the telno repo and pulled from GHCR:
    # the builder on this host stalls and the Asterisk compile takes 30-60 min.
    # Pin the sha-<short> tag instead of the branch tag for a reproducible deploy.
    image: ${TELNO_IMAGE:-ghcr.io/innotelinc/telno:feature-onboarding-email-edit}
    container_name: telno
    restart: unless-stopped
    # Reap the short-lived children the node server spawns (probes, ssl clients).
    init: true

    # A readable hostname on purpose: Docker's default is a hex container id,
    # and a SIP parser reads a digit-leading host as a broken IPv4 address.
    hostname: ${TELNO_HOSTNAME:-telno}

    network_mode: host

    env_file:
      - .env

    environment:
      # The process's own listener. Deliberately not called PORT in .env: an
      # ambient PORT in the host's environment would silently win over the file.
      PORT: ${TELNO_PORT:-8080}
      HOST: 0.0.0.0
      NODE_ENV: production
      DATA_DIR: /data
      ASTERISK_CONFIG_DIR: /etc/asterisk
      LOG_LEVEL: ${LOG_LEVEL:-warn}

    volumes:
      - telno-data:/data                 # database, secrets, recordings, backups
      - telno-asterisk:/etc/asterisk     # generated switch configuration
      - telno-spool:/var/spool/asterisk  # voicemail and fax spool

    # Asterisk gets time to hang up channels and flush its spool on a stop.
    stop_grace_period: 30s

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${TELNO_PORT:-8080}/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  # Adopted, not created: the control-plane build already wrote this volume, and
  # it holds the legacy database, faxes and recordings. Declaring it external
  # keeps compose from refusing a volume whose labels it did not write.
  telno-data:
    external: true
    name: telno_telno-data
  telno-asterisk:
  telno-spool:
